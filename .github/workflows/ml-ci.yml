
name: ML CI Workflow

on:
  push:
    branches:
      - main

jobs:
  run-ml-project:
    runs-on: windows-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run ML program
        run: python train.py
